name: One-time sync helionyx.pro internals

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-domain-internals.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Sync stale project copies on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -rlz server/app.py "$VPS_USER@$VPS_HOST:/var/www/helionyx/server/app.py"
          rsync -rlz deploy/finalize-capacity-article.py "$VPS_USER@$VPS_HOST:/var/www/helionyx/deploy/finalize-capacity-article.py"
          rsync -rlz .github/workflows/deploy.yml "$VPS_USER@$VPS_HOST:/var/www/helionyx/.github/workflows/deploy.yml"

      - name: Update live HELIONYX API domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
          CDEK_SENDER_PHONE: ${{ secrets.CDEK_SENDER_PHONE }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          HELIONYX_ADMIN_TOKEN: ${{ secrets.HELIONYX_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          API_ENV="$RUNNER_TEMP/helionyx-api.env"
          printf 'CDEK_CLIENT_ID=%s\nCDEK_CLIENT_SECRET=%s\nCDEK_SENDER_NAME=HELIONYX\nCDEK_SENDER_PHONE=%s\nCDEK_SHIPMENT_POINT=VRN5\nCDEK_AUTO_CREATE_ENABLED=1\nYOOKASSA_SHOP_ID=%s\nYOOKASSA_SECRET_KEY=%s\nHELIONYX_ADMIN_TOKEN=%s\nYOOKASSA_PAYMENTS_ENABLED=1\nYOOKASSA_RECEIPTS_ENABLED=1\nYOOKASSA_VAT_CODE=1\nYOOKASSA_PAYMENT_MODE=full_prepayment\nHELIONYX_PUBLIC_URL=https://helionyx.pro\nHELIONYX_DB_PATH=/var/lib/helionyx/orders.sqlite3\nHELIONYX_API_HOST=127.0.0.1\nHELIONYX_API_PORT=8787\n' \
            "$CDEK_CLIENT_ID" "$CDEK_CLIENT_SECRET" "$CDEK_SENDER_PHONE" "$YOOKASSA_SHOP_ID" "$YOOKASSA_SECRET_KEY" "$HELIONYX_ADMIN_TOKEN" > "$API_ENV"

          ssh "$VPS_USER@$VPS_HOST" "mkdir -p /tmp/helionyx-deploy/server"
          rsync -rlz server/app.py "$VPS_USER@$VPS_HOST:/tmp/helionyx-deploy/server/app.py"
          scp "$API_ENV" "$VPS_USER@$VPS_HOST:/tmp/helionyx-api.env"
          ssh "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/helionyx-update-api"
          rm -f "$API_ENV"

      - name: Verify old domain is absent on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -e
            ! grep -RIn --exclude-dir=.git "helionyx\.store" /var/www/helionyx
            ! grep -n "helionyx\.store" /opt/helionyx-api/app.py
            sudo -n grep -q "^HELIONYX_PUBLIC_URL=https://helionyx.pro$" /etc/helionyx-api.env
            curl -fsS http://127.0.0.1:8787/api/health >/dev/null
          '
