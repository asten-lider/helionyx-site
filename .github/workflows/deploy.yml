name: Deploy HELIONYX to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helionyx-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enrich all battery pages from HELIONYX catalog
        run: python3 deploy/enrich-battery-catalog-all.py

      - name: Add homepage article entry points
        run: python3 deploy/add-home-articles.py

      - name: Add capacity article visuals
        run: python3 deploy/enrich-capacity-article-visuals.py

      - name: Add JSON-LD markup for content analytics
        run: python3 deploy/add-content-analytics-jsonld.py

      - name: Install Yandex Metrika on every page
        run: python3 deploy/add-yandex-metrika.py

      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy website to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -rlz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'server/' \
            --exclude 'deploy/' \
            ./ "$VPS_USER@$VPS_HOST:/var/www/helionyx/"
          ssh "$VPS_USER@$VPS_HOST" "test -f /var/www/helionyx/index.html"

      - name: Deploy CDEK API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
          CDEK_SENDER_PHONE: ${{ secrets.CDEK_SENDER_PHONE }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          HELIONYX_ADMIN_TOKEN: ${{ secrets.HELIONYX_ADMIN_TOKEN }}
        run: |
          umask 077
          API_ENV="$RUNNER_TEMP/helionyx-api.env"
          printf 'CDEK_CLIENT_ID=%s\nCDEK_CLIENT_SECRET=%s\nCDEK_SENDER_NAME=HELIONYX\nCDEK_SENDER_PHONE=%s\nCDEK_SHIPMENT_POINT=VRN5\nCDEK_AUTO_CREATE_ENABLED=1\nYOOKASSA_SHOP_ID=%s\nYOOKASSA_SECRET_KEY=%s\nHELIONYX_ADMIN_TOKEN=%s\nYOOKASSA_PAYMENTS_ENABLED=1\nYOOKASSA_RECEIPTS_ENABLED=1\nYOOKASSA_VAT_CODE=1\nYOOKASSA_PAYMENT_MODE=full_prepayment\nHELIONYX_PUBLIC_URL=https://helionyx.pro\nHELIONYX_DB_PATH=/var/lib/helionyx/orders.sqlite3\nHELIONYX_API_HOST=127.0.0.1\nHELIONYX_API_PORT=8787\n' \
            "$CDEK_CLIENT_ID" "$CDEK_CLIENT_SECRET" "$CDEK_SENDER_PHONE" "$YOOKASSA_SHOP_ID" "$YOOKASSA_SECRET_KEY" "$HELIONYX_ADMIN_TOKEN" > "$API_ENV"

          ssh "$VPS_USER@$VPS_HOST" "mkdir -p /tmp/helionyx-deploy/server /tmp/helionyx-deploy/deploy && rm -rf /tmp/helionyx-deploy/deploy/*"
          rsync -az server/app.py "$VPS_USER@$VPS_HOST:/tmp/helionyx-deploy/server/app.py"
          rsync -az --delete deploy/ "$VPS_USER@$VPS_HOST:/tmp/helionyx-deploy/deploy/"
          scp "$API_ENV" "$VPS_USER@$VPS_HOST:/tmp/helionyx-api.env"
          ssh "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/helionyx-update-api"
          rm -f "$API_ENV"
