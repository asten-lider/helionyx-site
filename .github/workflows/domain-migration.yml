name: One-time domain migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/domain-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace helionyx.store with helionyx.pro
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          result = subprocess.run(
              ["git", "grep", "-Il", "helionyx.store"],
              text=True,
              capture_output=True,
          )
          files = [
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip() and not line.startswith(".github/workflows/")
          ]

          changed = []
          for name in files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              new_text = text.replace("helionyx.store", "helionyx.pro")
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(name)

          print(f"Updated {len(changed)} files")
          for name in changed:
              print(name)
          PY

          git diff --check

          if git diff --quiet; then
            echo "No non-workflow files required migration."
            exit 0
          fi

          git config user.name "HELIONYX Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git commit -m "Migrate site URLs to helionyx.pro"
          git push origin HEAD:main
