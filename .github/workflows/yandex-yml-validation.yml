name: Validate Yandex YML feed
on:
  pull_request:
    paths:
      - 'products/**'
      - 'tools/build-yandex-yml.py'
      - '.github/workflows/yandex-yml-validation.yml'
      - 'data/yandex-verified-*.csv'
      - 'data/yandex-17-draft-*.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate YML
        run: |
          python3 - <<'PY'
          import csv, importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("yml_builder","tools/build-yandex-yml.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          with open('/tmp/verified-test-inventory.csv','w',newline='') as out:
              writer=csv.writer(out);writer.writerow(['sku','price_rub','stock'])
              for page in sorted(Path('products').glob('*/index.html')):
                  product=mod.product_data(page)
                  offer=product.get('offers') or {}
                  if offer.get('price'):
                      writer.writerow([product['sku'],int(offer['price']),'in_stock'])
          PY
          python3 tools/build-yandex-yml.py --output /tmp/helionyx-yandex.yml --inventory /tmp/verified-test-inventory.csv
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/helionyx-yandex.yml').getroot()
          assert root.tag=='yml_catalog'
          offers=root.findall('./shop/offers/offer')
          assert len(offers)==17, len(offers)
          assert len({o.attrib['id'] for o in offers})==17
          assert all(o.findtext('url').startswith('https://helionyx.pro/products/') for o in offers)
          assert all(o.findtext('currencyId')=='RUB' for o in offers)
          assert all(float(o.findtext('price'))>0 for o in offers)
          assert all(o.find('picture') is not None for o in offers)
          print('YANDEX YML VALIDATION: PASS (CI sample values only, NOT verified inventory)')
          PY

      - name: Validate 14 confirmed local-stock offers without publishing
        run: |
          python3 tools/build-yandex-yml.py --inventory data/yandex-verified-2026-10-28.csv --output /tmp/helionyx-yandex-local-preview.yml
          python3 - <<'PY'
          import csv
          import xml.etree.ElementTree as ET
          with open('data/yandex-verified-2026-10-28.csv') as f:
              expected={r['sku']:r['price_rub'] for r in csv.DictReader(f)}
          offers=ET.parse('/tmp/helionyx-yandex-local-preview.yml').getroot().findall('./shop/offers/offer')
          actual={o.attrib['id']:o.findtext('price') for o in offers}
          assert len(offers)==14 and len(actual)==14 and actual==expected, (actual,expected)
          assert all(o.attrib['available']=='true' for o in offers)
          print('LOCAL STOCK PREVIEW PASS: 14 confirmed items, 3 unknown excluded')
          print('NOT PUBLISHED: site and checkout price verification still required')
          PY
      - name: Verify all YML prices against product page JSON-LD
        run: |
          python3 - <<'PY'
          import csv, importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('feed','tools/build-yandex-yml.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          pages={}
          for path in Path('products').glob('*/index.html'):
              product=module.product_data(path)
              offer=product.get('offers') or {}
              if offer.get('price'):
                  pages[str(product['sku'])]=int(offer['price'])
          with open('data/yandex-verified-2026-10-28.csv',encoding='utf-8') as src:
              rows=list(csv.DictReader(src))
          for row in rows:
              assert row['sku'] in pages, row['sku']
              assert int(row['price_rub'])==pages[row['sku']], (row['sku'],row['price_rub'],pages[row['sku']])
          print(f'PAGE PRICE PARITY PASS: {len(rows)} verified product prices')
          PY
      - name: Save unpublished YML preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: helionyx-yandex-local-14-preview
          path: /tmp/helionyx-yandex-local-preview.yml
          retention-days: 14


      - name: Validate owner-confirmed 17-SKU full draft
        run: |
          python3 tools/build-yandex-yml.py --inventory data/yandex-17-draft-2026-10-29.csv --output /tmp/helionyx-yandex-17.yml
          python3 - <<'PY'
          import csv, xml.etree.ElementTree as ET
          with open('data/yandex-17-draft-2026-10-29.csv',encoding='utf-8') as f:
              expected={r['sku']:r['price_rub'] for r in csv.DictReader(f)}
          offers=ET.parse('/tmp/helionyx-yandex-17.yml').findall('./shop/offers/offer')
          actual={o.attrib['id']:o.findtext('price') for o in offers}
          assert len(offers)==17 and actual==expected
          assert all(o.attrib['available']=='true' for o in offers)
          print('PASS: 17 available offers, matching approved prices')
          PY
