name: HELIONYX Security Regression Tests

on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API syntax and payment regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile API
        run: python3 -m py_compile server/app.py
      - name: Run tests without payment provider credentials
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
